<!DOCTYPE html>
<html>
<head>
  <title>Book Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#FAF7F0;
      --paper-deep:#F2EDE2;
      --ink:#211F1B;
      --green:#2F4538;
      --green-deep:#1E2E26;
      --gray:#8C8579;
      --line: rgba(33,31,27,0.12);
    }
    *{box-sizing:border-box;}
    body {
      margin:0;
      font-family:'Inter', sans-serif;
      background: var(--paper);
      color:var(--ink);
      text-align: center;
      padding:48px 24px 140px;
      -webkit-font-smoothing:antialiased;
    }
    h1{
      font-family:'Fraunces', serif;
      font-weight:600;
      font-size:2rem;
      letter-spacing:-0.01em;
      margin-bottom:48px;
    }
    h2{
      font-family:'Fraunces', serif;
      font-weight:500;
      font-size:1.3rem;
      margin-bottom:20px;
      text-align:left;
    }
    .container {
      margin: 0 auto;
      max-width: 760px;
    }

    /* Sell form card */
    .form-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:32px;
      box-shadow:0 14px 36px -22px rgba(33,31,27,0.3);
      text-align:left;
      margin-bottom:56px;
    }
    input[type="text"] {
      padding: 13px 16px;
      margin: 0 0 14px;
      width: 100%;
      border:1px solid var(--line);
      border-radius:10px;
      font-family:'Inter', sans-serif;
      font-size:0.95rem;
      background:var(--paper);
      color:var(--ink);
      display:block;
    }
    input[type="text"]:focus{
      outline:none;
      border-color:var(--green);
      background:#fff;
    }
    input[type="file"]{
      display:block;
      width:100%;
      padding:12px;
      margin-bottom:14px;
      border:1px dashed var(--line);
      border-radius:10px;
      font-family:'Inter', sans-serif;
      font-size:0.85rem;
      background:var(--paper-deep);
      color:var(--gray);
    }
    label{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:0.9rem;
      color:var(--ink);
      margin-bottom:20px;
    }
    label input[type="checkbox"]{
      width:16px; height:16px;
      accent-color:var(--green);
    }
    button {
      padding: 12px 22px;
      cursor: pointer;
      font-family:'Inter', sans-serif;
      font-weight:600;
      font-size:0.88rem;
      border-radius:30px;
      border:none;
      background:var(--green-deep);
      color:var(--paper);
      transition:transform .15s ease, opacity .2s ease;
    }
    button:hover{opacity:0.88;}
    button:active{transform:scale(0.97);}

    /* My Listings grid */
    #items{
      display:flex;
      flex-wrap:wrap;
      gap:20px;
      justify-content:flex-start;
    }
    .card {
      background: #fff;
      padding: 16px;
      margin:0;
      border-radius: 16px;
      box-shadow: 0 10px 26px -18px rgba(33,31,27,0.28);
      border:1px solid var(--line);
      display: inline-block;
      width: 200px;
      vertical-align: top;
      height: auto;
      text-align:left;
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 16px 32px -16px rgba(33,31,27,0.32);
    }
    img {
      border-radius: 10px;
      height: 180px;
      width: 100%;
      object-fit:cover;
      display:block;
      margin-bottom:12px;
      background:var(--paper-deep);
    }
    .card h3{
      font-family:'Fraunces', serif;
      font-weight:500;
      font-size:1rem;
      margin:0 0 12px;
      line-height:1.3;
    }
    .card button{
      width:100%;
      background:transparent;
      border:1px solid var(--ink);
      color:var(--ink);
    }
    .card button:hover{
      background:var(--ink);
      color:var(--paper);
      opacity:1;
    }

    /* Bottom pill nav */
    .pill-nav{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      display:flex;
      gap:6px;
      padding:8px;
      background:rgba(250,247,240,0.65);
      backdrop-filter:blur(16px) saturate(180%);
      -webkit-backdrop-filter:blur(16px) saturate(180%);
      border:1px solid rgba(255,255,255,0.5);
      border-radius:999px;
      box-shadow:0 12px 32px -10px rgba(33,31,27,0.35);
      z-index:100;
    }
    .pill-nav a{
      display:flex;
      align-items:center;
      gap:7px;
      padding:11px 20px;
      border-radius:999px;
      font-family:'Inter', sans-serif;
      font-size:0.86rem;
      font-weight:500;
      color:var(--ink);
      text-decoration:none;
      opacity:0.6;
      transition:opacity .2s ease, background .2s ease;
    }
    .pill-nav a svg{width:18px; height:18px; flex-shrink:0;}
    .pill-nav a:hover{opacity:0.9;}
    .pill-nav a.active{
      opacity:1;
      background:var(--green-deep);
      color:var(--paper);
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Book &amp; Uniform Marketplace</h1>

  <div class="form-card">
    <h2>Sell an Item</h2>
    <input type="file" id="imageInput">
    <input type="text" id="titleInput" placeholder="Enter title">
    <input type="text" id="descriptionInput" placeholder="Description">
    <input type="text" id="conditionInput" placeholder="Condition">
    <label> <input type="checkbox" id="qualityInput"> Quality Checked </label>
    <button onclick="addItem()">Sell (You earn ₹100)</button>
  </div>

  <h2>My Listings</h2>
  <div id="items"></div>
</div>

<nav class="pill-nav">
  <a href="tatti.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Buy
  </a>
  <a href="babababa.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Sell
  </a>
  <a href="UserDashboard.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Dashboard
  </a>
</nav>

<script>
const API = "https://book-marketplace-backend-49er.onrender.com";
//Push if not Logged In
// Load items on page start
// GET items from backend
window.onload = () => {
  loadMyItems();
};
async function loadMyItems() {
  try {
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Please login first");
      window.location.href = "RealLog.html";
      return;
    }
    const res = await fetch(`${API}/my-items`, {
      headers: {
        Authorization: "Bearer " + token
      }
    });
    const myItems = await res.json();
    const div = document.getElementById("items");
    div.innerHTML = "";
    myItems.forEach(item => {
      div.innerHTML += `
        <div class="card">
          <img src="data:image/jpeg;base64,${item.image}" />
          <h3>${item.title}</h3>
          <button onclick="deleteItem('${item._id}')">Delete</button>
        </div>
      `;
    });
  } catch (err) {
    console.error("Error loading items:", err);
  }
}
//Delete Item
async function deleteItem(id) {
  await fetch(`${API}/item/${id}`, {
    method: "DELETE"
  });
  loadMyItems();
}
// POST new item to backend
async function addItem() {
  const imageInput = document.getElementById("imageInput");
  const title = document.getElementById("titleInput").value.trim();
  if (!imageInput.files[0] || !title) {
    alert("Please add image and title");
    return;
  }
  const formData = new FormData();
  formData.append("title", title);
  formData.append("image", imageInput.files[0]);
  formData.append("description", document.getElementById("descriptionInput").value);
  formData.append("condition", document.getElementById("conditionInput").value);
  formData.append("qualityChecked", document.getElementById("qualityInput").checked);
  try {
    const token = localStorage.getItem("token");
const response = await fetch(`${API}/add-item`, {
    method: "POST",
    headers: {
        Authorization: "Bearer " + token
 },
    body: formData
});
const data = await response.json();
console.log(data);
if (!response.ok) {
throw new Error(data.message);
}
    alert("Item listed! You earned ₹100");
    imageInput.value = "";
    document.getElementById("titleInput").value = "";
    document.getElementById("descriptionInput").value = "";
    document.getElementById("conditionInput").value = "";
    document.getElementById("qualityInput").checked = false;
    loadMyItems();
  } catch (err) {
    console.error("Error adding item:", err);
  }
}
</script>
</body>
</html>
