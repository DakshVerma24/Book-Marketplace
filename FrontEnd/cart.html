<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#FAF7F0;
      --paper-deep:#F2EDE2;
      --ink:#211F1B;
      --green:#2F4538;
      --green-deep:#1E2E26;
      --gray:#8C8579;
      --line: rgba(33,31,27,0.12);
    }
    *{box-sizing:border-box;}
    body {
      margin:0;
      font-family:'Inter', sans-serif;
      background: var(--paper);
      color:var(--ink);
      text-align: center;
      padding:48px 24px 140px;
      -webkit-font-smoothing:antialiased;
    }
    h1{
      font-family:'Fraunces', serif;
      font-weight:600;
      font-size:2rem;
      letter-spacing:-0.01em;
      margin-bottom:8px;
    }
    .subtitle{color:var(--gray); font-size:0.95rem; margin-bottom:40px;}
    .container {
      margin: 0 auto;
      max-width: 760px;
    }

    /* Purchases grid */
    #items{
      display:flex;
      flex-wrap:wrap;
      gap:20px;
      justify-content:flex-start;
      text-align:left;
    }
    .card {
      background: #fff;
      padding: 20px;
      margin:0;
      border-radius: 16px;
      box-shadow: 0 10px 26px -18px rgba(33,31,27,0.28);
      border:1px solid var(--line);
      width: 220px;
      vertical-align: top;
      text-align:left;
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 16px 32px -16px rgba(33,31,27,0.32);
    }
    .card h3{
      font-family:'Fraunces', serif;
      font-weight:500;
      font-size:1rem;
      margin:0 0 10px;
      line-height:1.3;
    }
    .card p{
      margin:0;
      font-size:0.82rem;
      color:var(--gray);
      font-family:'JetBrains Mono', monospace;
    }

    .empty-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:48px 32px;
      box-shadow:0 14px 36px -22px rgba(33,31,27,0.3);
      color:var(--gray);
      max-width:420px;
      margin:0 auto;
    }
    .empty-card h2{
      font-family:'Fraunces', serif;
      font-weight:500;
      font-size:1.2rem;
      color:var(--ink);
      margin:0 0 8px;
    }
    .empty-card p{margin:0; font-size:0.9rem;}

    /* Bottom pill nav */
    .pill-nav{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      display:flex;
      gap:6px;
      padding:8px;
      background:rgba(250,247,240,0.65);
      backdrop-filter:blur(16px) saturate(180%);
      -webkit-backdrop-filter:blur(16px) saturate(180%);
      border:1px solid rgba(255,255,255,0.5);
      border-radius:999px;
      box-shadow:0 12px 32px -10px rgba(33,31,27,0.35);
      z-index:100;
    }
    .pill-nav a{
      display:flex;
      align-items:center;
      gap:7px;
      padding:11px 20px;
      border-radius:999px;
      font-family:'Inter', sans-serif;
      font-size:0.86rem;
      font-weight:500;
      color:var(--ink);
      text-decoration:none;
      opacity:0.6;
      transition:opacity .2s ease, background .2s ease;
    }
    .pill-nav a svg{width:18px; height:18px; flex-shrink:0;}
    .pill-nav a:hover{opacity:0.9;}
    .pill-nav a.active{
      opacity:1;
      background:var(--green-deep);
      color:var(--paper);
    }

    @media (max-width: 640px){
      body{ padding:32px 16px 120px; }
      h1{ font-size:1.6rem; }
      .subtitle{ margin-bottom:28px; }
      #items{ gap:14px; }
      .card{ width:calc(50% - 7px); }
      .pill-nav{ bottom:14px; padding:6px; }
      .pill-nav a{ padding:10px 14px; font-size:0.8rem; }
    }

    @media (max-width: 380px){
      .card{ width:100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Your Cart</h1>
  <p class="subtitle">Everything you've bought so far.</p>

  <div id="items"></div>
</div>

<nav class="pill-nav">
  <a href="tatti.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Buy
  </a>
  <a href="babababa.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Sell
  </a>
  <a href="Cart.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Cart
  </a>
  <a href="UserDashboard.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Dashboard
  </a>
</nav>

<script>
const API = "https://book-marketplace-backend-49er.onrender.com";

window.onload = loadCart;

async function loadCart() {
  const token = localStorage.getItem("token");
  if (!token) {
    alert("Please login first.");
    window.location.href = "RealLog.html";
    return;
  }

  const items = document.getElementById("items");

  try {
    const response = await fetch(`${API}/my-purchases`, {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    if (!response.ok) {
      throw new Error("Failed to load purchases");
    }

    const purchases = await response.json();

    if (purchases.length === 0) {
      items.innerHTML = `
        <div class="empty-card">
          <h2>No purchases yet</h2>
          <p>Items you buy will show up here.</p>
        </div>
      `;
      return;
    }

    items.innerHTML = "";
    purchases.forEach(purchase => {
      items.innerHTML += `
        <div class="card">
          <h3>${purchase.bookTitle}</h3>
          <p>Sold by ${purchase.sellerName || "Unknown"}</p>
          <p>Bought on ${new Date(purchase.soldAt).toLocaleDateString()}</p>
        </div>
      `;
    });

  } catch (err) {
    console.error("Error loading cart:", err);
    items.innerHTML = `
      <div class="empty-card">
        <h2>Couldn't load your cart</h2>
        <p>${err.message}</p>
      </div>
    `;
  }
}
</script>
</body>
</html>
