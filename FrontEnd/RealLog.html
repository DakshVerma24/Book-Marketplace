<!DOCTYPE html>
<html>
<head>
  <title>Login — ShikshaSeva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#FAF7F0;
      --paper-deep:#F2EDE2;
      --ink:#211F1B;
      --green:#2F4538;
      --green-deep:#1E2E26;
      --gray:#8C8579;
      --line: rgba(33,31,27,0.12);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-wrap{
      width: 100%;
      max-width: 440px;
    }

    /* Wordmark */
    .wordmark{
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .wordmark .mark{
      width: 10px; height: 14px;
      background: var(--green);
      border-radius: 1px 4px 1px 4px;
      display: inline-block;
    }

    /* Card */
    .auth-card{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 20px 48px -24px rgba(33,31,27,0.28);
    }

    .auth-card h1{
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .auth-card .sub{
      color: var(--gray);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .field-label{
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray);
      display: block;
      margin-bottom: 7px;
    }

    input {
      display: block;
      width: 100%;
      height: auto;
      padding: 13px 16px;
      margin-bottom: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }
    input:focus{
      outline: none;
      border-color: var(--green);
      background: #fff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 30px;
      border: none;
      background: var(--green-deep);
      color: var(--paper);
      cursor: pointer;
      height: auto;
      transition: opacity .2s ease, transform .15s ease;
    }
    button:hover{ opacity: 0.88; }
    button:active{ transform: scale(0.97); }

    .auth-footer{
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--gray);
    }
    .auth-footer a{
      color: var(--green);
      font-weight: 500;
      text-decoration: none;
    }
    .auth-footer a:hover{ text-decoration: underline; }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="wordmark"><span class="mark"></span>ShikshaSeva</div>

  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your account to continue.</p>

    <label class="field-label" for="Username">Username</label>
    <input type="text" id="Username" placeholder="Your username">

    <label class="field-label" for="Password">Password</label>
    <input type="password" id="Password" placeholder="Your password">

    <button onclick="loginUser()">Log in</button>
  </div>

  <div class="auth-footer">
    Don't have an account? <a href="LoginPage.html">Register here</a>
  </div>
</div>

<script>
const API = "http://localhost:5000";

async function loginUser() {
  const Username = document.getElementById("Username").value;
  const Password = document.getElementById("Password").value;

  try {
    const res = await fetch(`${API}/login`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ Username, Password })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("Username", data.username);

      alert("Login successful 🚀");
      window.location.href = "UserDashboard.html";
    } else {
      alert(data.message || "Login failed");
    }

  } catch (err) {
    console.error("Login error:", err);
  }
}
</script>

</body>
</html>
