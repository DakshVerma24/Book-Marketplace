<html>
<head>
  <title>Register — ShikshaSeva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#FAF7F0;
      --paper-deep:#F2EDE2;
      --ink:#211F1B;
      --green:#2F4538;
      --green-deep:#1E2E26;
      --gray:#8C8579;
      --line: rgba(33,31,27,0.12);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-wrap{
      width: 100%;
      max-width: 440px;
    }

    /* Wordmark */
    .wordmark{
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .wordmark .mark{
      width: 10px; height: 14px;
      background: var(--green);
      border-radius: 1px 4px 1px 4px;
      display: inline-block;
    }

    /* Card */
    .auth-card{
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 20px 48px -24px rgba(33,31,27,0.28);
    }

    .auth-card h1{
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .auth-card .sub{
      color: var(--gray);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .field-label{
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray);
      display: block;
      margin-bottom: 7px;
    }

    input {
      display: block;
      width: 100%;
      height: auto;
      padding: 13px 16px;
      margin-bottom: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }
    input:focus{
      outline: none;
      border-color: var(--green);
      background: #fff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 30px;
      border: none;
      background: var(--green-deep);
      color: var(--paper);
      cursor: pointer;
      height: auto;
      transition: opacity .2s ease, transform .15s ease;
    }
    button:hover{ opacity: 0.88; }
    button:active{ transform: scale(0.97); }

    .auth-footer{
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--gray);
    }
    .auth-footer a{
      color: var(--green);
      font-weight: 500;
      text-decoration: none;
    }
    .auth-footer a:hover{ text-decoration: underline; }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="wordmark"><span class="mark"></span>ShikshaSeva</div>

  <div class="auth-card">
    <h1>Create an account</h1>
    <p class="sub">Join ShikshaSeva and start buying or selling.</p>

    <label class="field-label" for="Username">Username</label>
    <input type="text" id="Username" placeholder="Choose a username">

    <label class="field-label" for="Password">Password</label>
    <input type="password" id="Password" placeholder="Create a password">

    <label class="field-label" for="emailInput">Email</label>
    <input type="email" id="emailInput" placeholder="your@email.com">

    <label class="field-label" for="phoneInput">Phone Number</label>
    <input type="text" id="phoneInput" placeholder="10-digit mobile number">

    <button onclick="addUser()">Register</button>
  </div>

  <div class="auth-footer">
    Already registered? <a href="RealLog.html">Log in here</a>
  </div>
</div>

<script>
async function addUser() {

    const Username = document.getElementById("Username").value.trim();
    const Password = document.getElementById("Password").value;
    const email = document.getElementById("emailInput").value.trim();
    const phone = document.getElementById("phoneInput").value.trim();

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phoneRegex = /^[6-9]\d{9}$/;

    if (Username === "" || Password === "" || email === "" || phone === "") {
        alert("Please fill all fields.");
        return;
    }

    if (!emailRegex.test(email)) {
        alert("Please enter a valid email address.");
        return;
    }

    if (!phoneRegex.test(phone)) {
        alert("Please enter a valid 10-digit phone number.");
        return;
    }

    try {

        const response = await fetch("http://localhost:5000/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                Username: Username,
                Email: email,
                Phone: phone,
                Password: Password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message);
            return;
        }

        alert("Registration Successful!");
        window.location.href = "RealLog.html";

    } catch (err) {
        console.error(err);
        alert("Server error. Please try again.");
    }
}
</script>
</html>
